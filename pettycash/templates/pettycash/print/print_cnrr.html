<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CNRR</title>

<style>
@page {
    size: A4 landscape;
    margin: 8mm;
}

body {
    margin: 0;
    background: #f0f2f5;
    font-family: Arial, sans-serif;
}

.cnrr-print-page {
    width: 281mm;
    margin: 12px auto;
    background: white;
    padding: 8mm;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
    box-sizing: border-box;
}

.excel-sheet {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.excel-sheet td {
    line-height: 1.1;
}

@media print {
    body {
        background: white;
    }

    .cnrr-print-page {
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
    }
}
</style>
</head>

<body>
    <div class="cnrr-print-page cnrr-landscape-page">
        {{ cnrr_sheet_html|safe }}
    </div>
</body>
</html>
