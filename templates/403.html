{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Access Denied | TESDA PCVMS</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Access denied page for TESDA PCVMS.">
    <meta name="theme-color" content="#0877d9">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/pcvms-icon.svg' %}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
          crossorigin="anonymous">

    <style>
        body {
            background: linear-gradient(135deg, #0038A8, #001f5c);
            color: white;
            text-align: center;
            padding-top: 10%;
        }

        .error-box {
            background: white;
            color: #333;
            display: inline-block;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #CE1126;
        }

        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="error-box">
    <div class="error-code">403</div>
    <h3>Access Forbidden</h3>
    <p>You do not have permission to access this page.</p>

    <a href="{% url 'users:role_redirect' %}" class="btn btn-primary btn-home" aria-label="Go back to dashboard">
        Go Back to Dashboard
    </a>
</div>

</body>
</html>
