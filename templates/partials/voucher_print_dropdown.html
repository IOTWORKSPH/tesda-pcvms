<button type="button"
        class="btn btn-outline-secondary dropdown-toggle"
        data-toggle="dropdown"
        data-boundary="viewport"
        aria-haspopup="true"
        aria-expanded="false"
        title="Print documents">
    <i class="fas fa-print"></i>
</button>
<div class="dropdown-menu dropdown-menu-right shadow pcv-print-menu">
    <a class="dropdown-item" href="{% url 'pettycash:print_pcv' voucher.uuid %}" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-file-invoice mr-2 text-primary"></i>Print PCV
    </a>
    {% if voucher.pr_no %}
        <a class="dropdown-item" href="{% url 'pettycash:print_pr' voucher.uuid %}" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-file-alt mr-2 text-info"></i>Print PR
        </a>
    {% endif %}
    {% if voucher.iar_no %}
        <a class="dropdown-item" href="{% url 'pettycash:print_iar' voucher.uuid %}" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-clipboard-check mr-2 text-success"></i>Print IAR
        </a>
    {% endif %}
    {% if voucher.has_cnrr %}
        <a class="dropdown-item" href="{% url 'pettycash:print_cnrr' voucher.uuid %}" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-file-medical mr-2 text-danger"></i>Print CNRR
        </a>
    {% endif %}
    {% if voucher.pr_no or voucher.iar_no or voucher.has_cnrr %}
        <div class="dropdown-divider"></div>
        <a class="dropdown-item font-weight-bold" href="{% url 'pettycash:print_all' voucher.uuid %}" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-print mr-2 text-dark"></i>Print All Documents
        </a>
    {% endif %}
    <div class="dropdown-divider"></div>
    <a class="dropdown-item" href="{% url 'pettycash:export_voucher_excel' voucher.uuid %}">
        <i class="fas fa-file-excel mr-2 text-success"></i>Export Excel
    </a>
</div>
