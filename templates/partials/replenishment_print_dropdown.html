<button type="button"
        class="btn pcv-action-btn pcv-action-reports dropdown-toggle"
        data-toggle="dropdown"
        data-boundary="viewport"
        data-flip="false"
        aria-haspopup="true"
        aria-expanded="false"
        title="Replenishment reports">
    <i class="fas fa-print"></i>
    <span>Reports</span>
</button>
<div class="dropdown-menu dropdown-menu-right shadow pcv-print-menu">
    <form method="post" action="{% url 'pettycash:replenishment_package_pdf' %}" class="m-0">
        {% csrf_token %}
        <input type="hidden" name="replenishment_id" value="{{ replenishment.pk }}">
        <button type="submit" class="dropdown-item">
            <span class="pcv-menu-icon pcv-menu-icon-red"><i class="fas fa-file-pdf"></i></span>
            <span>
                <strong>Print PDF Package</strong>
                <small>Complete audit-ready report</small>
            </span>
        </button>
    </form>
    <form method="post" action="{% url 'pettycash:replenishment_export_excel' %}" class="m-0">
        {% csrf_token %}
        <input type="hidden" name="replenishment_id" value="{{ replenishment.pk }}">
        <button type="submit" class="dropdown-item">
            <span class="pcv-menu-icon pcv-menu-icon-green"><i class="fas fa-file-excel"></i></span>
            <span>
                <strong>Report Workbook</strong>
                <small>Appendix 49, 50, 51, summary, categories</small>
            </span>
        </button>
    </form>
    <a class="dropdown-item" href="{% url 'pettycash:replenishment_bundle_excel' replenishment.pk %}">
        <span class="pcv-menu-icon pcv-menu-icon-blue"><i class="fas fa-file-archive"></i></span>
        <span>
            <strong>Supporting Excel ZIP</strong>
            <small>PCV, PR, IAR, and CNRR files</small>
        </span>
    </a>
</div>
